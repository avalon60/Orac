[home_assistant]
# Active connection settings used by the managed Home Assistant service.
protocol = http
host = 192.168.1.203
port = 8123
verify_ssl = false
websocket_path = /api/websocket

# Home Assistant personal access tokens are stored encrypted in the plugin PAT
# vault, not in plugin.ini. Initialise with:
# bin/plugin-pat-mgr.sh --plugin home_assistant --set access_token

# Planned service controls. The first-pass service currently always performs
# startup sync when the enabled plugin service starts; this key is reserved for
# allowing startup sync to be disabled.
sync_on_startup = true

# Periodic structural reconciliation supplements registry-change events.
structural_refresh_mode = hourly
structural_refresh_minutes = 60

# Websocket/event listener controls. The service subscribes to state and
# registry events after publishing the initial atomic snapshot.
enable_websocket = true
ws_reconnect_seconds = 10
ws_ping_interval_seconds = 30
ws_ping_timeout_seconds = 10

# Bounded semantic inventory and composed-operation defaults. These are runtime
# configuration values rather than architectural limits.
capability_page_size = 50
capability_max_page_size = 200
max_entities_per_operation = 25
target_service_discovery_limit = 250
# Host governance patterns use canonical Home Assistant entity IDs and shell
# wildcards. An empty allow-list denies that operation class.
visible_entity_patterns = *
readable_entity_patterns = *
controllable_entity_patterns = *
denied_entity_patterns =
confirmation_required_capabilities = close,lock,open,select_option,set_position,set_value,stop,trigger_action,unlock
control_timeout_seconds = 5
light_control_timeout_seconds = 5
light_state_query_timeout_seconds = 5
sensor_query_timeout_seconds = 5

# Planned state polling fallback controls. Event-driven updates and periodic
# structural reconciliation are active; these keys reserve a state-only poll.
enable_state_poll_fallback = false
state_poll_seconds = 120

# Planned plugin-local logging verbosity. Current logging follows Orac's
# service logger configuration.
log_level = INFO
